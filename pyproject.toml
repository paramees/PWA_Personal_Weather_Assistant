[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-wardrobe-bot"
version = "0.1.0"
description = "Personal Telegram weather & wardrobe advisor bot with hybrid deterministic + AI architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
weather-bot = "weather_wardrobe.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_wardrobe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
