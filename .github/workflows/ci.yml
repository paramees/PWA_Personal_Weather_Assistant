name: CI & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked secrets (Gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest git /repo --verbose --redact

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run pytest suite
        run: pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-test]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - name: Deploy to Oracle Cloud VPS
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "${ORACLE_HOST}" || -z "${ORACLE_USER}" || -z "${ORACLE_SSH_KEY}" ]]; then
            echo "Deploy secrets are not configured yet; skipping Oracle Cloud deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/deploy_key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_PORT="${ORACLE_PORT:-22}"

          # The server key uses SSH Forced Command (command="/usr/local/bin/deploy-weather-bot.sh",restrict),
          # so this session cannot open a shell or run arbitrary commands.
          ssh -i "$KEY_FILE" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "${ORACLE_USER}@${ORACLE_HOST}"
