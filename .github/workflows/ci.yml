name: CI & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for leaked secrets (Gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest git /repo --verbose --redact

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run pytest suite
        run: pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-and-test]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    steps:
      - name: Deploy to Oracle Cloud VPS
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${ORACLE_HOST}" || -z "${ORACLE_USER}" || -z "${ORACLE_SSH_KEY}" ]]; then
            echo "Deploy secrets are not configured yet; skipping Oracle Cloud deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/deploy_key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_PORT="${ORACLE_PORT:-22}"
          APP_DIR="${ORACLE_APP_DIR:-__DEFAULT__}"

          ssh -i "$KEY_FILE" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "${ORACLE_USER}@${ORACLE_HOST}" \
            "bash -s -- '${APP_DIR}' '${BRANCH_NAME}'" << 'REMOTE_SCRIPT'
          set -euo pipefail
          RAW_APP_DIR="$1"
          BRANCH_NAME="$2"

          if [[ "$RAW_APP_DIR" == "__DEFAULT__" ]]; then
            TARGET_DIR="$HOME/weather-wardrobe-bot"
          elif [[ "$RAW_APP_DIR" == "~/"* ]]; then
            TARGET_DIR="$HOME/${RAW_APP_DIR#~/}"
          else
            TARGET_DIR="$RAW_APP_DIR"
          fi

          if [[ ! -d "$TARGET_DIR" ]]; then
            echo "App directory $TARGET_DIR does not exist on server."
            exit 1
          fi

          cd "$TARGET_DIR"
          if [[ ! -f .env ]]; then
            echo "Missing .env in $TARGET_DIR. Create it once on the server from .env.example."
            exit 1
          fi

          git fetch --all --prune
          git reset --hard "origin/${BRANCH_NAME}"
          mkdir -p data
          docker compose up -d --build --remove-orphans

          sleep 5
          if ! docker compose ps --status running --services | grep -qx "weather-bot"; then
            echo "Container weather-bot is not running after deploy:"
            docker compose logs --tail=50
            exit 1
          fi
          echo "Deployed ${BRANCH_NAME} successfully."
          REMOTE_SCRIPT
